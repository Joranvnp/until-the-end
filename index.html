// ---------- utilitaires ----------
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let SEED=1337, rnd=mulberry(SEED);
const R=(a,b)=>a+rnd()*(b-a), RI=(a,b)=>Math.floor(a+rnd()*(b-a+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
function hash2(x,y){let h=(x*374761393+y*668265263+SEED*1442695)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vn1(x,s=0){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return hash2(i,s)*(1-u)+hash2(i+1,s)*u}
function fbm1(x,s=0){let v=0,a=.5,f=1;for(let i=0;i<4;i++){v+=a*vn1(x*f,s+i*31);a*=.5;f*=2}return v/.9375}
function vn2(x,y,s){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  const a=hash2(ix+s*7919,iy),b=hash2(ix+1+s*7919,iy),c=hash2(ix+s*7919,iy+1),d=hash2(ix+1+s*7919,iy+1);
  return (a*(1-ux)+b*ux)*(1-uy)+(c*(1-ux)+d*ux)*uy}
function fbm2(x,y,s,o=4){let v=0,a=.5,f=1,t=0;for(let i=0;i<o;i++){v+=a*vn2(x*f,y*f,s+i*13);t+=a;a*=.5;f*=2}return v/t}
function mk(wd,ht){const c=document.createElement('canvas');c.width=wd;c.height=ht;return c}
function hex(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function rgb(a){return`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`}
function shade(h,f){const c=hex(h);return rgb(c.map(v=>clamp(f>0?v+(255-v)*f:v*(1+f),0,255)))}
function mixc(a,b,t){const A=hex(a),B=hex(b);return rgb(A.map((v,i)=>lerp(v,B[i],t)))}
// contour sombre autour des pixels opaques (lisibilité pixel art)
function outline(c,col='#120e1c'){
  const g=c.getContext('2d'),id=g.getImageData(0,0,c.width,c.height),d=id.data,W=c.width,H=c.height,o=new Uint8ClampedArray(d);
  const oc=hex(col);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;if(d[i+3]>0)continue;
    let n=false;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<W&&Y<H&&d[(Y*W+X)*4+3]>128){n=true;break}}
    if(n){o[i]=oc[0];o[i+1]=oc[1];o[i+2]=oc[2];o[i+3]=255}}
  id.data.set(o);g.putImageData(id,0,0);return c}
function flipC(c){const f=mk(c.width,c.height),g=f.getContext('2d');g.translate(c.width,0);g.scale(-1,1);g.drawImage(c,0,0);return f}

// =====================================================================
//  GÉNÉRATION DES TEXTURES PIXEL ART
// =====================================================================
const TEX={}, WALLTEX={}, ICON={}, SPR={};
function pixTile(fn,seed){const c=mk(16,16),g=c.getContext('2d'),id=g.createImageData(16,16),r=mulberry(seed);
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){const col=fn(x,y,r);if(!col)continue;const i=(y*16+x)*4,cc=typeof col==='string'?hex(col):col;id.data[i]=cc[0];id.data[i+1]=cc[1];id.data[i+2]=cc[2];id.data[i+3]=cc[3]??255}
  g.putImageData(id,0,0);return c}
const PAL={
  dirt:['#2c1a16','#3d2419','#4f301f','#633d27','#784c31'],
  grass:['#17473d','#1f6b4a','#2f9252','#5cc45a','#b0ec6e'],
  stone:['#1d2031','#282c43','#353a56','#454b6b','#5c6388'],
  deep:['#130f1f','#1c1630','#261f41','#322953','#433767'],
  snow:['#a9b8d6','#c6d3ea','#dfe8f7','#f2f6ff','#ffffff'],
};
function rockFn(p,seed){return(x,y,r)=>{
  const n=fbm2(x*.35+seed,y*.35,seed,3), cells=vn2(x*.5+seed*3,y*.5,seed+9);
  let k=Math.floor(n*4.2); if(cells>.72)k++; if(cells<.2)k--;
  // reflets haut-gauche des blocs de roche
  const e=vn2((x-1)*.5+seed*3,(y-1)*.5,seed+9); if(e<cells-.12)k++; else if(e>cells+.12)k--;
  return p[clamp(k,0,4)]}}
function makeTex(id,v){
  const s=id*97+v*13+3;
  switch(id){
    case DIRT: return pixTile((x,y,r)=>{const n=fbm2(x*.3+v*9,y*.3,s,3);let k=Math.floor(n*4.6);if(r()<.06)k+=r()<.5?2:-2;return PAL.dirt[clamp(k,0,4)]},s);
    case GRASS: { const hs=[];const rr=mulberry(s);for(let x=0;x<16;x++)hs.push(3+Math.floor(rr()*3)+(x%5===2?1:0));
      return pixTile((x,y,r)=>{ if(y<hs[x]){ if(y===0)return PAL.grass[4]; if(y===1)return PAL.grass[3]; return y===hs[x]-1?PAL.grass[1]:PAL.grass[2]}
        const n=fbm2(x*.3+v*9,y*.3,s,3);let k=Math.floor(n*4.6);if(r()<.05)k+=r()<.5?2:-2;return PAL.dirt[clamp(k,0,4)]},s);}
    case SNOW: { const hs=[];const rr=mulberry(s);for(let x=0;x<16;x++)hs.push(4+Math.floor(rr()*3));
      return pixTile((x,y,r)=>{ if(y<hs[x]) return y===0?PAL.snow[4]:PAL.snow[y===hs[x]-1?1:3]; return rockFn(PAL.stone,s)(x,y,r)},s);}
    case STONE: return pixTile(rockFn(PAL.stone,s),s);
    case DEEP: return pixTile(rockFn(PAL.deep,s),s);
    case CASTLE: return pixTile((x,y)=>{const row=Math.floor(y/4),off=row%2?4:0;const bx=(x+off)%8;if(y%4===3||bx===7)return '#3d3b4c';return (y%4===0||bx===0)?'#a2a4b8':'#8d8fa3'},s);
    case BEDROCK: return pixTile((x,y,r)=>{const n=fbm2(x*.4,y*.4,s,3);return n>.62?'#3a3346':n>.45?'#231e2c':'#16121c'},s);
    case PLANK: return pixTile((x,y)=>{if(y%4===3)return '#6b4526';if((x===2||x===13)&&y%4===1)return '#4a2f1a';const n=vn2(x*.25,y*1.5+v,s);return n>.6?'#c99560':n>.3?'#b88550':'#a3733f'},s);
    case BRICK: return pixTile((x,y)=>{const row=Math.floor(y/4),off=row%2?4:0;const bx=(x+off)%8;if(y%4===3||bx===7)return '#5a2f2a';if(y%4===0)return '#c46a52';return bx===0?'#b45e48':'#a5503e'},s);
    case LOG: return pixTile((x,y,r)=>{if(x<3||x>12)return null;if(x===3||x===12)return '#3e2816';const n=vn2(x*.8,y*.25+v*3,s);return n>.65?'#8c6038':n>.35?'#7a5230':'#5f3e22'},s);
    case LEAF: return pixTile((x,y,r)=>{const n=fbm2(x*.32+v*5,y*.32,s,3);if(n<.3)return null;const k=Math.floor((n-.3)*7+(y<8?.6:0));return PAL.grass[clamp(k,0,4)]},s);
    case TORCH: return pixTile((x,y)=>{if(x>=7&&x<=8&&y>=7&&y<=15)return x===7?'#8a5a2c':'#6b4526';if(x>=6&&x<=9&&y>=4&&y<=6)return y===4?'#fff3b0':'#ffb43a';if(x>=7&&x<=8&&y===3)return '#ffe080';return null},s);
    case PLANT: { const kind=v%4; return pixTile((x,y,r)=>{
      if(kind===0){ const blades=[3,5,8,10,12]; for(const b of blades){const h=8+((b*7+v)%5);if(x===b&&y>=16-h)return y<16-h+2?PAL.grass[4]:PAL.grass[3]} return null}
      if(kind===1){ if(x===8&&y>=8)return PAL.grass[2]; if(x===7&&y===11)return PAL.grass[3]; if(Math.abs(x-8)+Math.abs(y-6)<=2)return (x===8&&y===6)?'#ffe066':'#ff6f91'; return null}
      if(kind===2){ if(x===6&&y>=9)return PAL.grass[2]; if(x===10&&y>=11)return PAL.grass[2]; if(Math.abs(x-6)+Math.abs(y-7)<=1)return (x===6&&y===7)?'#fff':'#8ec9ff'; if(Math.abs(x-10)+Math.abs(y-9)<=1)return '#ffd23f'; return null}
      const blades=[2,4,6,9,11,13]; for(const b of blades){const h=4+((b*5+v)%4);if(x===b&&y>=16-h)return PAL.grass[3]} return null},s);}
    case VINE: { const rr=mulberry(s);const sx=5+Math.floor(rr()*6);return pixTile((x,y)=>{const wx=sx+Math.round(Math.sin(y*.5+v)*1.2);if(x===wx)return y%5===0?'#3f9150':'#1f6b4a';
        if((y%5===2)&&(x===wx+1||x===wx+2))return '#2f9252';if((y%5===4)&&(x===wx-1||x===wx-2))return '#2a7a48';return null},s)}
    case MUSH: return pixTile((x,y)=>{const caps=[[5,10,3],[11,12,2]];for(const[cx,cy,r]of caps){if(y===cy&&Math.abs(x-cx)<=r)return '#d8fff0';if(y>cy&&y<=15&&x===cx)return '#bfe8e0';
        if(y<cy&&y>=cy-r&&Math.abs(x-cx)<=r-(cy-y-1)*.6){return (x-cx+y-cy)<-r?'#c8fff0':((x*3+y)%5===0?'#e8fff8':'#4fe8c8')}}return null},s);
    case CPLANT: return pixTile((x,y)=>{const bl=[[3,6],[6,9],[9,5],[12,8]];for(const[bx,h]of bl){if(y>=16-h&&Math.abs(x-bx-(16-y)*.15*(bx<8?-1:1))<.6)return y<16-h+2?'#4a9a8a':'#24564f'}return null},s);
    case WATER: return pixTile(()=>null,1);
    case CRYSTAL: return pixTile((x,y,r)=>{const base=rockFn(PAL.deep,s)(x,y,r);const c1=Math.abs(x-5)*2+Math.abs(y-9)<7,c2=Math.abs(x-11)*2+Math.abs(y-6)<6;if(c1||c2){const hl=(c1&&x<5)||(c2&&x<11);return hl?'#f0c2ff':'#b05cf0'}return base},s);
    default: { // minerais : roche + pépites
      const P={[COAL]:['#15151b','#24242c','#3b3b47'],[COPPER]:['#8a3f1c','#d9813f','#ffbf7a'],[IRON]:['#7a5a48','#d8b9a0','#fff0e0'],[SILVER]:['#8b97ad','#dfe6f2','#ffffff'],[GOLD]:['#9c6a10','#ffd23f','#fff4b0'],[DIAMOND]:['#1f8fa8','#62f0ff','#e8ffff']}[id];
      const base=(id===DIAMOND||id===GOLD)?PAL.deep:PAL.stone; const rr=mulberry(s); const blobs=[];
      for(let i=0;i<4+Math.floor(rr()*2);i++)blobs.push([2+rr()*12,2+rr()*12,1+rr()*1.4]);
      return pixTile((x,y,r)=>{for(const[bx,by,br]of blobs){const dx=x-bx,dy=y-by,d=Math.sqrt(dx*dx+dy*dy);if(d<br+.5){if(d<br*.45&&dx<0&&dy<0)return P[2];if(dx+dy>br*.6)return P[0];return P[1]}}return rockFn(base,s)(x,y,r)},s);}
  }
}
function makeCanopy(r,seed){const R0=r*16+10,W=R0*2+10,H=Math.round(R0*1.75)+8,c=mk(W,H),g=c.getContext('2d'),rr=mulberry(seed);
  const blobs=[],n=6+r*2;for(let i=0;i<n;i++){const a=rr()*6.28,d=rr()*R0*.5;blobs.push([W/2+Math.cos(a)*d*1.15,H/2+Math.sin(a)*d*.65,R0*(.38+rr()*.22)])}
  const id=g.createImageData(W,H),D=id.data,P=PAL.grass;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){let best=-9;for(const[bx,by,br]of blobs){const dx=x-bx,dy=y-by,f=1-(dx*dx+dy*dy)/(br*br);if(f>0){const lit=f*.55-(dx*.6+dy)/br*.45;if(lit>best)best=lit}}
    if(best<=-9)continue;const n2=vn2(x*.25,y*.25,seed)-.5;let k=1.2+best*3+n2*1.4-(y/H)*1.1+(((x+y)&1)?.22:-.22);k=clamp(Math.floor(k),0,4);
    const cc=hex(P[k]),i=(y*W+x)*4;D[i]=cc[0];D[i+1]=cc[1];D[i+2]=cc[2];D[i+3]=255}
  g.putImageData(id,0,0);for(let i=0;i<r*6;i++){const x=Math.floor(rr()*W),y=Math.floor(rr()*H*.6);const p=g.getImageData(x,y,1,1).data;if(p[3]){g.fillStyle=rr()<.2?'#ffd0e0':P[4];g.fillRect(x,y,1,1)}}
  return outline(c,'#0b1a17')}
function makeWall(kind,v){const s=kind*31+v*7;
  return pixTile((x,y,r)=>{const n=fbm2(x*.3+v*5,y*.3,s,3);
    if(kind===1){const p=['#2a1a12','#33211a','#3c2a1f'];return p[clamp(Math.floor(n*3.2),0,2)]}
    if(kind===3){const row=Math.floor(y/4),off=row%2?4:0,bx=(x+off)%8;return (y%4===3||bx===7)?'#24222f':'#3a3948'}
    const p=['#1c1c25','#24242f','#2c2c39'];return p[clamp(Math.floor(n*3.2),0,2)]},s)}
function buildTextures(){
  for(let id=1;id<TD.length;id++){TEX[id]=[];for(let v=0;v<4;v++)TEX[id].push(makeTex(id,v))}
  for(let k=1;k<=3;k++){WALLTEX[k]=[];for(let v=0;v<4;v++)WALLTEX[k].push(makeWall(k,v))}

    const n=fbm2(x*.055,y*.085,4,4),m=fbm2(x*.03,y*.03,11,3);if(n>.64||(m>.68&&n>.5))fg[idx(x,y)]=AIR}

  {const cx=C,cy=surf[C]+26;for(let dy=-5;dy<=4;dy++)for(let dx=-11;dx<=11;dx++){if((dx*dx)/121+(dy*dy)/25<1)fg[idx(cx+dx,cy+dy)]=AIR}
   for(let dx=-9;dx<=9;dx++)if(rnd()<.45){const y=cy+4;for(let k=0;k<2;k++)if(fg[idx(cx+dx,y+k)]!==AIR)fg[idx(cx+dx,y+k)]=rnd()<.5?GOLD:CRYSTAL}}

const activeTouches=new Map();
function touchUpdate(){touch.l=touch.r=touch.j=false;let worldTouch=null;
  for(const[,t]of activeTouches){let hit=false;for(const b of touchBtns)if(t.x>=b.x&&t.x<b.x+b.w&&t.y>=b.y&&t.y<b.y+b.h){touch[b.k]=true;hit=true}if(!hit&&!t.ui)worldTouch=t}
  if(worldTouch){mouse.x=worldTouch.x;mouse.y=worldTouch.y;mouse.l=true;mouse.inside=true}else mouse.l=false;updateMouseWorld()}

function updateMouseWorld(){mouse.wx=mouse.x+cam.x;mouse.wy=mouse.y+cam.y}
function toLocal(ev){const r=cv.getBoundingClientRect(),d=cv.width/r.width;return{x:(ev.clientX-r.left)*d/S,y:(ev.clientY-r.top)*d/S}}
function uiClick(x,y){for(let i=uiHits.length-1;i>=0;i--){const h=uiHits[i];if(x>=h.x&&x<h.x+h.w&&y>=h.y&&y<h.y+h.h){h.fn();return true}}return false}

cv.addEventListener('mouseleave',()=>{mouse.inside=false;mouse.l=mouse.r=false});
cv.addEventListener('mousedown',ev=>{audioInit();cv.focus();const p=toLocal(ev);mouse.x=p.x;mouse.y=p.y;mouse.inside=true;updateMouseWorld();

  if(ev.code==='KeyR')toggleOrder();if(ev.code==='Escape'||ev.code==='KeyP'){if(panel&&ev.code==='Escape'){panel=null;cursorItem=null}else{paused=!paused;pauseHelp=false}}if(ev.code==='KeyM'){muted=!muted;toast(muted?'Son coupé':'Son activé',1.5)}

cv.addEventListener('touchstart',ev=>{ev.preventDefault();audioInit();for(const t of ev.changedTouches){const p=toLocal(t);const ui=state!=='play'||uiHits.some(h=>p.x>=h.x&&p.x<h.x+h.w&&p.y>=h.y&&p.y<h.y+h.h)||(panel&&panelRect&&p.x>=panelRect.x&&p.x<panelRect.x+panelRect.w&&p.y>=panelRect.y&&p.y<panelRect.y+panelRect.h);
